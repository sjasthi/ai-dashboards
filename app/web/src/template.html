<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Data Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .summary, .recommendations { margin-top: 20px; }
        img.chart { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload CSV File</h1>
        <form id="file-upload-form" enctype="multipart/form-data">
            <input type="file" name="file" id="file-input" accept=".csv">
            <button type="submit">Upload and Generate Report</button>
        </form>

        <!-- Display Summary Statistics -->
        <div class="summary" id="summary"></div>

        <!-- Display Recommendations -->
        <div class="recommendations" id="recommendations"></div>

        <!-- Display Chart -->
        <img src="" alt="Chart" class="chart" id="chart">

        <!-- Download Report -->
        <a href="#" id="download-link">Download Report</a>
    </div>

    <script>
        document.getElementById('file-upload-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (response.ok) {
                document.getElementById('summary').innerText = "Summary:\n";
                for (const key in data.summary) {
                    document.getElementById('summary').innerText += `${key}: ${data.summary[key]}\n`;
                }

                document.getElementById('recommendations').innerText = "Recommendations:\n";
                for (let i = 0; i < data.recommendations.length; i++) {
                    document.getElementById('recommendations').innerText += `1. ${data.recommendations[i]}\n`;
                }

                document.getElementById('chart').src = data.chart_url;
                document.getElementById('download-link').href = data.pdf_url;
            } else {
                alert("An error occurred.");
            }
        });
    </script>
</body>
</html>
