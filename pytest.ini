[pytest]
# Without this, `pytest` fails to collect every test module with
# "ModuleNotFoundError: No module named 'app'". The suite only ever worked when
# invoked as `python -m pytest`, because that form puts the current directory on
# sys.path and plain `pytest` does not. Two things depend on the repo root being
# importable: `import app.api`, and tests/test_export_api.py reusing the session
# harness via `from tests.test_generate_report_api import ...`.
#
# pythonpath is relative to rootdir (this file's directory), so both invocations
# now behave identically and the documented demo command `pytest -v` works.
pythonpath = .

# Applies only when no path argument is given, so `pytest tests/test_x.py` is
# unaffected. Keeps a bare `pytest` from walking ai-env/ and node_modules/.
testpaths = tests
